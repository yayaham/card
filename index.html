<style>
:root{--brown:#7a2e17;--gold:#b8892f;--gold-soft:#f6efe0;--ink:#1f1a17;--muted:#6b625c;--line:#e7ded2;--bg:#f4f1ec;--card:#ffffff}
@media (prefers-color-scheme:dark){:root{--ink:#f3eee8;--muted:#b3a99f;--line:#3a332d;--bg:#161311;--card:#211c19;--gold-soft:#2e2619}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:440px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.top{background:var(--brown);height:72px}
.logo{width:112px;height:112px;margin:-56px auto 0;background:var(--card);border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid var(--gold)}
.logo img{width:84px;height:auto}
.who{text-align:center;padding:14px 20px 4px}
.title{font-size:14px;color:var(--gold);letter-spacing:.2em}
.name{font-size:30px;font-weight:700;margin:4px 0 0;letter-spacing:.08em}
.name small{font-size:15px;font-weight:500;margin-left:6px;letter-spacing:0;color:var(--muted)}
.en{font-size:15px;color:var(--muted);margin-top:2px}
.org{text-align:center;padding:14px 20px 0;line-height:1.55}
.org b{display:block;font-size:17px}
.org span{display:block;font-size:12px;color:var(--muted);letter-spacing:.02em}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:20px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;border-radius:14px;background:var(--gold-soft);color:var(--brown);text-decoration:none;font-size:13px;border:0;font-family:inherit;cursor:pointer}
@media (prefers-color-scheme:dark){.act{color:#e6c27a}}
.act svg{width:24px;height:24px}
.list{border-top:1px solid var(--line);margin:0 20px;padding:8px 0}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .k{width:56px;flex:none;font-size:13px;color:var(--muted);padding-top:1px}
.row .v{font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.row .v small{display:block;font-size:12px;color:var(--muted)}
.save{display:block;margin:12px 20px 22px;padding:14px;border-radius:14px;background:var(--brown);color:#fff;text-align:center;font-size:16px;font-weight:600;text-decoration:none;border:0;width:calc(100% - 40px);font-family:inherit;cursor:pointer}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

const $ = id => document.getElementById(id);
const digits = s => s.replace(/[^\d+]/g, "");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mapUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(CARD.address);

$("logo").src = LOGO;
$("title").textContent = CARD.title;
$("name").textContent = CARD.name;
$("degree").textContent = CARD.degree;
$("nameEn").textContent = CARD.nameEn;
$("org").innerHTML = CARD.orgs.map(o => `<b>${esc(o.zh)}</b>${o.en ? `<span>${esc(o.en)}</span>` : ""}`).join("");
$("aCall").href = "tel:" + digits(CARD.mobile);
$("aMail").href = "mailto:" + CARD.email;
$("aMap").href = mapUrl;
$("foot").textContent = CARD.orgs[0].zh;

const rows = [
  ["手機", CARD.mobile, "tel:" + digits(CARD.mobile)],
  ["電話", CARD.tel + (CARD.ext ? " 分機 " + CARD.ext : ""), "tel:" + digits(CARD.tel) + (CARD.ext ? "," + CARD.ext : "")],
  ["傳真", CARD.fax, ""],
  ["Email", CARD.email, "mailto:" + CARD.email],
  ["地址", CARD.address + `<small>${esc(CARD.addressEn)}</small>`, mapUrl, true],
  ["統一編號", CARD.taxId, ""]
].filter(r => r[1]);
$("list").innerHTML = rows.map(([k, v, href, raw]) => {
  const val = raw ? v : esc(v);
  const tag = href ? `a href="${esc(href)}"${href.startsWith("http") ? ' target="_blank" rel="noopener"' : ""}` : "div";
  return `<${tag} class="row"><span class="k">${k}</span><span class="v">${val}</span></${tag.split(" ")[0]}>`;
}).join("");

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1800); }

$("save").onclick = () => {
  const v = s => String(s).replace(/([,;\\])/g, "\\$1");
  const lines = [
    "BEGIN:VCARD","VERSION:3.0",
    `N:${v(CARD.name.slice(0,1))};${v(CARD.name.slice(1))};;;`,
    `FN:${v(CARD.name)}`,
    `ORG:${v(CARD.orgs[0].zh)}`,
    `TITLE:${v(CARD.title)}`,
    `TEL;TYPE=CELL:${CARD.mobile}`,
    `TEL;TYPE=WORK,VOICE:${CARD.tel}${CARD.ext ? " ext." + CARD.ext : ""}`,
    `TEL;TYPE=WORK,FAX:${CARD.fax}`,
    `EMAIL;TYPE=INTERNET:${CARD.email}`,
    `ADR;TYPE=WORK:;;${v(CARD.address)};;;;`,
    `URL:${location.href.split("#")[0]}`,
    `NOTE:${v(CARD.orgs.map(o=>o.zh).join("／") + "　統一編號 " + CARD.taxId)}`,
    "END:VCARD"
  ];
  const blob = new Blob([lines.join("\r\n")], { type: "text/vcard;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = CARD.name + ".vcf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

$("aShare").onclick = async () => {
  const data = { title: CARD.name + "｜" + CARD.orgs[0].zh, url: location.href };
  try {
    if (navigator.share) { await navigator.share(data); return; }
    await navigator.clipboard.writeText(location.href); toast("已複製名片連結");
  } catch (e) { if (e && e.name !== "AbortError") toast("請複製網址列的連結"); }
};
</script>
