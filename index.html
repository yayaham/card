<style>
:root{--navy:#0f1f33;--navy2:#1c3350;--gold:#c9a24a;--gold-d:#8a6a1f;--cream:#f8f5ee;--ink:#1f2a37;--muted:#5d6874;--line:#e6dfd0}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e9e5dc;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;min-height:100vh;background:var(--navy)}
@media (min-width:500px){body{padding:24px 0}.wrap{min-height:auto;border-radius:28px;overflow:hidden}}
.hero{color:#f3ead7;padding:18px 20px 26px}
.brand{display:flex;align-items:center;gap:10px}
.brand .coin{width:46px;height:auto;flex:none}
.brand .ws{display:flex;flex-direction:column;gap:4px;min-width:0}
.brand .zh{height:19px;width:auto;max-width:100%}
.brand .en{height:9px;width:auto;max-width:100%}
.person{display:flex;align-items:center;gap:20px;margin-top:26px}
.photo{width:118px;height:118px;flex:none;border-radius:50%;border:2px solid var(--gold);background:var(--navy2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.photo svg{width:48px;height:48px;color:var(--gold)}
.who{min-width:0}
.name{margin:0;font-size:30px;font-weight:600;letter-spacing:.14em;white-space:nowrap}
.name small{font-size:14px;color:var(--gold);letter-spacing:0;margin-left:12px;font-weight:500}
.name-en{color:var(--gold);letter-spacing:.28em;font-size:13px;margin-top:6px;padding-left:8px}
.sheet{background:var(--cream);border-radius:24px 24px 0 0;padding:20px 20px 28px}
@media (min-width:500px){.sheet{border-radius:24px 24px 0 0}}
.roles{list-style:none;margin:0;padding:0}
.roles li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:17px}
.roles li:last-child{border-bottom:0}
.roles b{font-weight:600;color:var(--gold-d);white-space:nowrap}
.intro{margin:14px 0 0;padding:2px 0 2px 12px;border-left:3px solid var(--gold);color:var(--muted);font-size:16px;line-height:1.75}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:15px 10px;font-size:16px;font-weight:600;text-decoration:none;cursor:pointer;font-family:inherit;color:#fff}
.btn svg{width:22px;height:22px;flex:none}
.line{background:#06c755}.fb{background:#1877f2}
.save{grid-column:1/-1;background:var(--navy);color:#f3ead7}
.info{margin-top:16px;border-top:1px solid var(--line);padding-top:6px}
.info a,.info div{display:flex;gap:12px;padding:9px 0;color:inherit;text-decoration:none;font-size:17px;line-height:1.5}
.info span:first-child{width:46px;flex:none;color:var(--muted);font-size:15px;padding-top:1px}
.info span:last-child{overflow-wrap:anywhere}
.share{display:block;margin:16px auto 0;background:none;border:0;color:var(--muted);font-size:15px;font-family:inherit;cursor:pointer;text-decoration:underline}
.photo img{object-position:center 18%}
.ws .d{display:none}
body.light .wrap{background:#fff}
body.light .hero{color:var(--navy);position:relative;isolation:isolate}
body.light .hero::before{content:"";position:absolute;inset:0;z-index:-1;background:url(wall.jpg) left center/cover no-repeat;opacity:var(--wall-opacity,.3)}
body.light .ws .l{display:none}
body.light .ws .d{display:block}
body.light .photo{background:#eef1f5}
body.light .name small{color:var(--gold-d)}
body.light .name-en{color:var(--gold-d)}
body.light .sheet{background:#fff;border-top:3px solid var(--gold)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.info a:last-child span:last-child{white-space:nowrap;font-size:15.5px;letter-spacing:-.01em}
.intro{word-break:keep-all}
</style>
</head>
<body class="light">
<div class="wrap">

<script>
// ===== 名片資料：要改內容只改這一區 =====
const CARD = {
  name: "吳宗翰",
  degree: "博士",
  nameEn: "HENRY WU",
  roles: [
    { org: "碁元會計師事務所", title: "執行長" },
    { org: "碁元投資有限公司", title: "執行董事" },
    { org: "碁元知識移動股份有限公司", title: "負責人" }
  ],
  intro: "新創 IPO 輔導 × 事務所 AI 轉型 × 創新財會服務",
  photo: "photo.jpg",       // 大頭照
  line: "https://line.me/ti/p/~yayaham",   // LINE 加好友連結
  facebook: "https://www.facebook.com/yayaham",   // 臉書網址
  mobile: "0930-258-729",
  tel: "(02)2567-9527",
  ext: "158",
  email: "a27260888@gmail.com",
  address: "台北市中山區南京東路二段72號11樓"
};
// ===== 以下是程式，不用動 =====
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const digits = s => s.replace(/[^\d+]/g, "");
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)}

$("name").textContent = CARD.name;
$("degree").textContent = CARD.degree;
$("nameEn").textContent = CARD.nameEn;
$("roles").innerHTML = CARD.roles.map(r => `<li><span>${esc(r.org)}</span><b>${esc(r.title)}</b></li>`).join("");
$("intro").textContent = CARD.intro;
if (CARD.photo) $("photo").innerHTML = `<img src="${esc(CARD.photo)}" alt="${esc(CARD.name)}">`;

[["bLine", CARD.line, "LINE"], ["bFb", CARD.facebook, "臉書"]].forEach(([id, url, label]) => {
  if (url) $(id).href = url;
  else $(id).onclick = e => { e.preventDefault(); toast(label + " 連結尚未設定"); };
});

const map = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(CARD.address);
$("info").innerHTML = [
  ["手機", CARD.mobile, "tel:" + digits(CARD.mobile)],
  ["電話", CARD.tel + (CARD.ext ? " 分機 " + CARD.ext : ""), "tel:" + digits(CARD.tel) + (CARD.ext ? "," + CARD.ext : "")],
  ["Email", CARD.email, "mailto:" + CARD.email],
  ["地址", CARD.address, map]
].map(([k, v, h]) => `<a href="${esc(h)}"${h.startsWith("http") ? ' target="_blank" rel="noopener"' : ""}><span>${k}</span><span>${esc(v)}</span></a>`).join("");

$("bSave").onclick = () => { location.href = "henry-wu.vcf"; };

$("bShare").onclick = async () => {
  try {
    if (navigator.share) { await navigator.share({ title: CARD.name + "｜" + CARD.roles[0].org, url: location.href }); return; }
    await navigator.clipboard.writeText(location.href); toast("已複製名片連結");
  } catch (e) { if (e && e.name !== "AbortError") toast("請複製網址列的連結"); }
};
</script>
